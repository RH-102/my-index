<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NASDAQ + NYSE Top 125</title>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #222;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    a {
      color: #1f5fbf;
      text-decoration: none;
    }

    h1 {
      margin-bottom: 6px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 22px;
    }

    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 16px;
    }

    select,
    input {
      padding: 9px 10px;
      border: 1px solid #ccc;
      border-radius: 7px;
      background: white;
    }

    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .tab {
      border: 1px solid #cbd5e1;
      background: white;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      color: #334155;
    }

    .tab.active {
      background: #2563eb;
      border-color: #2563eb;
      color: white;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }

    .card,
    .section {
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .card {
      padding: 18px;
    }

    .card-title {
      color: #777;
      font-size: 13px;
      margin-bottom: 7px;
    }

    .card-value {
      font-size: 22px;
      font-weight: bold;
    }

    .section {
      padding: 20px;
      overflow-x: auto;
    }

    .notice {
      padding: 12px 14px;
      border-radius: 8px;
      background: #fff6d8;
      margin-bottom: 18px;
      display: none;
    }

    .definition {
      color: #666;
      font-size: 13px;
      margin: 0 0 18px 0;
      line-height: 1.55;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 940px;
    }

    th,
    td {
      padding: 10px;
      border-bottom: 1px solid #eee;
      text-align: left;
    }

    th.number,
    td.number {
      text-align: right;
    }

    th {
      border-bottom: 2px solid #ddd;
    }

    .top55-missing {
      background: #fff7ed;
    }

    .badge {
      display: inline-block;
      padding: 3px 7px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .badge-missing {
      background: #ffedd5;
      color: #9a3412;
    }

    .badge-held {
      background: #dcfce7;
      color: #166534;
    }

    .rank-up {
      color: #16833b;
      font-weight: 700;
    }

    .rank-down {
      color: #c62828;
      font-weight: 700;
    }

    .rank-flat,
    .rank-new {
      color: #64748b;
      font-weight: 600;
    }

    .loading,
    .error {
      padding: 28px;
      text-align: center;
      color: #666;
    }

    .error {
      color: #b00020;
    }
  </style>
</head>

<body>
  <div class="container">
    <div style="margin-bottom:16px;">
      <a href="index.html">← Back to My Index</a>
    </div>

    <h1>NASDAQ + NYSE Top 125</h1>

    <div class="subtitle">
      Largest companies by market capitalization at quarterly snapshot dates.
    </div>

    <div class="controls">
      <label>
        Snapshot:
        <select id="snapshotSelect"></select>
      </label>

      <input
        id="searchBox"
        type="text"
        placeholder="Search company or ticker"
      >
    </div>

    <div class="tabs">
      <button class="tab active" data-type="All">
        NASDAQ + NYSE Top 125
      </button>

      <button class="tab" data-type="ExFinancials">
        Top 125 ex Financials
      </button>
    </div>

    <div class="definition" id="definitionText"></div>

    <div id="temporaryNotice" class="notice"></div>

    <div class="cards">
      <div class="card">
        <div class="card-title">Snapshot Date</div>
        <div class="card-value" id="snapshotDate">--</div>
      </div>

      <div class="card">
        <div class="card-title">Actual Data Date</div>
        <div class="card-value" id="dataDate">--</div>
      </div>

      <div class="card">
        <div class="card-title">Status</div>
        <div class="card-value" id="status">--</div>
      </div>

      <div class="card">
        <div class="card-title">Companies</div>
        <div class="card-value" id="companyCount">--</div>
      </div>

      <div class="card">
        <div class="card-title">Top 55 Not Held</div>
        <div class="card-value" id="top55MissingCount">--</div>
      </div>
    </div>

    <div class="section">
      <div id="tableArea" class="loading">
        Loading Top 125 data...
      </div>
    </div>
  </div>

<script>
let allRows = [];
let selectedRows = [];
let selectedListType = "All";
let portfolioSymbols = new Set();
let snapshotDates = [];
let previousRankMap = new Map();
let previousSnapshotDate = "";

const SYMBOL_ALIASES = {
  GOOG: "ALPHABET",
  GOOGL: "ALPHABET"
};

function normalizeSymbol(symbol) {
  const normalized = String(symbol || "").trim().toUpperCase();
  return SYMBOL_ALIASES[normalized] || normalized;
}

function loadCSV(path) {
  const separator = path.includes("?") ? "&" : "?";
  const url = path + separator + "v=" + Date.now();

  return new Promise((resolve, reject) => {
    Papa.parse(url, {
      download: true,
      header: true,
      dynamicTyping: true,
      complete: results => resolve(results.data),
      error: reject
    });
  });
}

Promise.all([
  loadCSV("data/top100_history.csv"),
  loadCSV("data/latest.csv")
])
.then(([historyRows, holdingRows]) => {
  allRows = historyRows.filter(
    row => row.SnapshotDate && row.Symbol && row.ListType
  );

  portfolioSymbols = new Set(
    holdingRows
      .filter(row => row.Symbol)
      .map(row => normalizeSymbol(row.Symbol))
  );

  if (allRows.length === 0) {
    document.getElementById("tableArea").innerHTML =
      '<div class="error">No Top 125 snapshots yet. Run the GitHub workflow once to rebuild the data.</div>';
    return;
  }

  snapshotDates = [
    ...new Set(allRows.map(row => row.SnapshotDate))
  ].sort();

  const select = document.getElementById("snapshotSelect");

  snapshotDates.forEach(date => {
    const option = document.createElement("option");
    option.value = date;
    option.textContent = date;
    select.appendChild(option);
  });

  select.value = snapshotDates[snapshotDates.length - 1];
  select.addEventListener("change", renderSnapshot);

  document
    .getElementById("searchBox")
    .addEventListener("input", renderTable);

  document.querySelectorAll(".tab").forEach(button => {
    button.addEventListener("click", function() {
      selectedListType = this.dataset.type;

      document.querySelectorAll(".tab").forEach(tab => {
        tab.classList.remove("active");
      });

      this.classList.add("active");
      updateDefinition();
      renderSnapshot();
    });
  });

  updateDefinition();
  renderSnapshot();
})
.catch(error => {
  document.getElementById("tableArea").innerHTML =
    '<div class="error">Could not load Top 125 or portfolio data.</div>';
  console.error(error);
});

function updateDefinition() {
  const text = document.getElementById("definitionText");
  const base = selectedListType === "ExFinancials"
    ? "Excludes companies classified in the Financials sector by StockAnalysis, then ranks the remaining NASDAQ + NYSE companies by market cap."
    : "Includes all companies in the combined NASDAQ + NYSE ranking.";

  text.innerHTML =
    base +
    " <strong>Orange rows</strong> are companies ranked in the Top 55 that are not currently held in My Index. " +
    "The <strong>vs Prev Quarter</strong> column compares the selected snapshot with the immediately preceding snapshot for the same list.";
}

function renderSnapshot() {
  const date = document.getElementById("snapshotSelect").value;

  selectedRows = allRows
    .filter(
      row =>
        row.SnapshotDate === date &&
        row.ListType === selectedListType
    )
    .sort((a, b) => a.Rank - b.Rank);

  if (selectedRows.length === 0) {
    document.getElementById("tableArea").innerHTML =
      '<div class="error">This list has not been generated yet. Run the GitHub workflow once.</div>';
    return;
  }

  const availableDates = [
    ...new Set(
      allRows
        .filter(row => row.ListType === selectedListType)
        .map(row => row.SnapshotDate)
    )
  ].sort();

  const currentIndex = availableDates.indexOf(date);
  previousSnapshotDate = currentIndex > 0 ? availableDates[currentIndex - 1] : "";
  previousRankMap = new Map();

  if (previousSnapshotDate) {
    allRows
      .filter(
        row =>
          row.SnapshotDate === previousSnapshotDate &&
          row.ListType === selectedListType
      )
      .forEach(row => {
        previousRankMap.set(normalizeSymbol(row.Symbol), Number(row.Rank));
      });
  }

  const first = selectedRows[0];

  document.getElementById("snapshotDate").textContent = first.SnapshotDate;
  document.getElementById("dataDate").textContent = first.DataDate;
  document.getElementById("status").textContent = first.Status;
  document.getElementById("companyCount").textContent = selectedRows.length;

  const top55Missing = selectedRows.filter(
    row => Number(row.Rank) <= 55 && !portfolioSymbols.has(normalizeSymbol(row.Symbol))
  );
  document.getElementById("top55MissingCount").textContent = top55Missing.length;

  const notice = document.getElementById("temporaryNotice");

  if (first.Status === "Temporary") {
    notice.style.display = "block";
    notice.textContent =
      `Historical market-cap data was not available yet. This ${first.SnapshotDate} snapshot temporarily uses data from ${first.DataDate}.`;
  } else {
    notice.style.display = "none";
  }

  renderTable();
}

function rankChangeHTML(row) {
  if (!previousSnapshotDate) {
    return '<span class="rank-flat">—</span>';
  }

  const symbol = normalizeSymbol(row.Symbol);
  const previousRank = previousRankMap.get(symbol);

  if (previousRank === undefined) {
    return '<span class="rank-new">NEW</span>';
  }

  const change = previousRank - Number(row.Rank);

  if (change > 0) {
    return `<span class="rank-up">↑ ${change}</span>`;
  }

  if (change < 0) {
    return `<span class="rank-down">↓ ${Math.abs(change)}</span>`;
  }

  return '<span class="rank-flat">—</span>';
}

function portfolioStatusHTML(row) {
  const held = portfolioSymbols.has(normalizeSymbol(row.Symbol));
  const top55 = Number(row.Rank) <= 55;

  if (held) {
    return '<span class="badge badge-held">Held</span>';
  }

  if (top55) {
    return '<span class="badge badge-missing">Top 55 · Not Held</span>';
  }

  return '—';
}

function renderTable() {
  const term = document
    .getElementById("searchBox")
    .value
    .trim()
    .toLowerCase();

  const rows = selectedRows.filter(row => {
    if (!term) return true;

    return (
      String(row.Company).toLowerCase().includes(term) ||
      String(row.Symbol).toLowerCase().includes(term)
    );
  });

  let html = `
    <table>
      <thead>
        <tr>
          <th class="number">Rank</th>
          <th class="number">vs Prev Quarter</th>
          <th>Company</th>
          <th>Ticker</th>
          <th>My Index</th>
          <th>Exchange</th>
          <th class="number">Market Cap</th>
        </tr>
      </thead>
      <tbody>
  `;

  rows.forEach(row => {
    const isMissingTop55 =
      Number(row.Rank) <= 55 &&
      !portfolioSymbols.has(normalizeSymbol(row.Symbol));

    html += `
      <tr class="${isMissingTop55 ? "top55-missing" : ""}">
        <td class="number">${row.Rank}</td>
        <td class="number">${rankChangeHTML(row)}</td>
        <td>${row.Company}</td>
        <td><strong>${row.Symbol}</strong></td>
        <td>${portfolioStatusHTML(row)}</td>
        <td>${row.Exchange}</td>
        <td class="number">${row.MarketCapDisplay}</td>
      </tr>
    `;
  });

  html += "</tbody></table>";

  document.getElementById("tableArea").innerHTML = html;
}
</script>
</body>
</html>
