name: Update Index and Deploy

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "*.html"
      - "requirements.txt"
      - ".github/workflows/update-index.yml"

  schedule:
    - cron: "10 16 * * 1-5"
      timezone: "America/New_York"

concurrency:
  group: index-update-and-pages
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:

  update-index:

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update prices and weights
        run: |
          python scripts/update_prices.py

      - name: Update quarterly Top 125
        continue-on-error: true
        run: |
          python scripts/update_top100.py

      - name: Update market risk dashboard
        continue-on-error: true
        run: |
          set +e
          python scripts/update_risk_v3.py > data/risk_update.log 2>&1
          status=$?
          cat data/risk_update.log
          echo "exit_code=$status" >> data/risk_update.log
          exit 0

      - name: Apply dashboard UI preferences
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          # Remove Mortgage Delinquency from the published dashboard data.
          dashboard = Path("data/risk_dashboard.csv")
          if dashboard.exists():
              frame = pd.read_csv(dashboard)
              if "Indicator" in frame.columns:
                  frame = frame[frame["Indicator"] != "Mortgage Delinquency"]
                  frame.to_csv(dashboard, index=False)

          # Keep DFII10 and Mortgage Delinquency hidden from the visible table,
          # and remove the mortgage explanation/source text from the footnote.
          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          text = text.replace(
              'row => row.RowType === "Metric" && row.Indicator !== "DFII10 (10Y Real Yield)"',
              'row => row.RowType === "Metric" && !["DFII10 (10Y Real Yield)", "Mortgage Delinquency"].includes(row.Indicator)'
          )

          text = text.replace(
              '    `<strong>Mortgage Delinquency</strong>：住宅按揭贷款逾期率。判断重点不是单看绝对水平，而是是否连续上升，以及同比上升速度是否进入历史异常区间。<br>` +\n',
              ''
          )

          text = text.replace(
              'Mortgage Delinquency 来自 Federal Reserve Board；',
              ''
          )

          path.write_text(text, encoding="utf-8")
          PY

      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Save all CSV databases, persistent source caches, and UI preferences.
          git add data/*.csv data/risk_update.log index.html

          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "Update daily index data"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
