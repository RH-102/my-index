name: Update Index and Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "*.html"
      - "*.js"
      - "data/rebalances.csv"
      - "data/official_share_checks.csv"
      - "requirements.txt"
      - ".github/workflows/update-index.yml"
  schedule:
    - cron: "37 16 * * 1-5"
      timezone: "America/New_York"
    - cron: "17 18 * * 1-5"
      timezone: "America/New_York"
    - cron: "7 20 * * 1-5"
      timezone: "America/New_York"

concurrency:
  group: index-update-and-pages
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check whether backup run is needed
        id: backup-check
        shell: bash
        run: |
          skip=false
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" != "37 16 * * 1-5" ]; then
            needed="$(python scripts/refresh_dashboard.py --backup-needed)"
            if [ "$needed" = "false" ]; then
              skip=true
            fi
          fi
          echo "skip_backup=$skip" >> "$GITHUB_OUTPUT"

      - name: Check calculation and loading regressions
        if: steps.backup-check.outputs.skip_backup != 'true'
        run: |
          python -m unittest discover -s tests
          node --test tests/*.test.cjs

      - name: Refresh index, benchmarks and risk with status reporting
        if: steps.backup-check.outputs.skip_backup != 'true'
        run: python scripts/refresh_dashboard.py

      - name: Update quarterly Top 125
        if: steps.backup-check.outputs.skip_backup != 'true'
        continue-on-error: true
        run: python scripts/update_top100.py

      - name: Sanity-check Top 125 market caps
        if: steps.backup-check.outputs.skip_backup != 'true'
        continue-on-error: true
        run: python scripts/sanitize_top100.py

      - name: Save updated data
        if: steps.backup-check.outputs.skip_backup != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.csv data/*.log data/update_status.json
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "Update daily index data and refresh status"
            pushed=false
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase -X theirs origin/main
              if git push origin HEAD:main; then
                pushed=true
                break
              fi
              sleep 2
            done
            if [ "$pushed" != "true" ]; then
              echo "Failed to push updated data after 3 attempts"
              exit 1
            fi
          fi

      - name: Configure GitHub Pages
        if: steps.backup-check.outputs.skip_backup != 'true'
        uses: actions/configure-pages@v5

      - name: Upload website
        if: steps.backup-check.outputs.skip_backup != 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy website
        if: steps.backup-check.outputs.skip_backup != 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      # Publish the failure banner and the last complete data first, then fail
      # the run. A green deployment alone must not imply every refresh worked.
      - name: Verify dashboard refresh outcome
        if: steps.backup-check.outputs.skip_backup != 'true'
        run: python scripts/refresh_dashboard.py --check
