name: Add password protection

on:
  push:
    paths:
      - '.github/workflows/add-password-auth.yml'

permissions:
  contents: write

jobs:
  add-auth:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add shared auth script to Pages
        shell: bash
        run: |
          set -e
          for file in index.html top100.html risk-history.html; do
            if ! grep -q 'src="auth.js"' "$file"; then
              sed -i '/<head>/a\  <script src="auth.js"></script>' "$file"
            fi
          done

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html top100.html risk-history.html
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Add password protection to Pages"
          git push
