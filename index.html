<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Index Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f7fa;
      color: #222;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 16px;
    }

    .nav {
      margin-bottom: 30px;
    }

    .nav a {
      display: inline-block;
      text-decoration: none;
      color: #ffffff;
      background: #2563eb;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
    }

    .nav a:hover {
      background: #1d4ed8;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .card-title {
      color: #777;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .card-value {
      font-size: 27px;
      font-weight: bold;
    }

    .positive {
      color: #16833b;
    }

    .negative {
      color: #c62828;
    }

    .section {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 30px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      text-align: left;
      padding: 10px;
      border-bottom: 2px solid #ddd;
    }

    td {
      padding: 10px;
      border-bottom: 1px solid #eee;
    }

    th.number,
    td.number {
      text-align: right;
    }

    canvas {
      max-height: 420px;
    }

    .loading {
      padding: 30px;
      text-align: center;
      color: #666;
    }

    .error {
      color: #b00020;
      padding: 20px;
    }
  </style>
</head>

<body>
<div class="container">

  <h1>My Index Dashboard</h1>

  <div class="subtitle">
    Personal market-cap weighted index tracker
  </div>

  <div class="nav">
    <a href="top100.html">View NASDAQ + NYSE Top 125 →</a>
  </div>

  <div class="cards">
    <div class="card">
      <div class="card-title">Index Level</div>
      <div class="card-value" id="indexLevel">--</div>
    </div>

    <div class="card">
      <div class="card-title">Daily Return</div>
      <div class="card-value" id="dailyReturn">--</div>
    </div>

    <div class="card">
      <div class="card-title">Since Inception</div>
      <div class="card-value" id="sinceInception">--</div>
    </div>

    <div class="card">
      <div class="card-title">Total Market Value</div>
      <div class="card-value" id="totalValue">--</div>
    </div>

    <div class="card">
      <div class="card-title">Holdings</div>
      <div class="card-value" id="holdingCount">--</div>
    </div>

    <div class="card">
      <div class="card-title">Market Date</div>
      <div class="card-value" id="marketDate">--</div>
    </div>
  </div>

  <div class="section">
    <h2>Index Performance</h2>
    <canvas id="indexChart"></canvas>
  </div>

  <div class="section">
    <h2>Top 10 Holdings</h2>
    <canvas id="topHoldingsChart"></canvas>
  </div>

  <div class="section">
    <h2>Current Holdings</h2>
    <div id="tableArea" class="loading">Loading holdings...</div>
  </div>

</div>

<script>
let holdingsData = [];
let indexHistory = [];

function loadCSV(path) {
  return new Promise((resolve, reject) => {
    Papa.parse(path, {
      download: true,
      header: true,
      dynamicTyping: true,
      complete: function(results) {
        resolve(
          results.data.filter(
            row => Object.values(row).some(
              value => value !== null && value !== ""
            )
          )
        );
      },
      error: reject
    });
  });
}

Promise.all([
  loadCSV("data/latest.csv"),
  loadCSV("data/index_history.csv")
])
.then(([holdings, history]) => {
  holdingsData = holdings
    .filter(row => row.Symbol)
    .sort((a, b) => b.Weight - a.Weight);

  indexHistory = history
    .filter(row => row.Date)
    .sort((a, b) => new Date(a.Date) - new Date(b.Date));

  updateSummary();
  createIndexChart();
  createHoldingsChart();
  createTable();
})
.catch(error => {
  document.getElementById("tableArea").innerHTML =
    '<div class="error">Could not load index data.</div>';
  console.error(error);
});

function updateSummary() {
  if (holdingsData.length === 0 || indexHistory.length === 0) return;

  const latestIndex = indexHistory[indexHistory.length - 1];
  const firstIndex = indexHistory[0];
  const totalValue = holdingsData.reduce(
    (sum, row) => sum + row.MarketValue,
    0
  );

  const indexLevel = latestIndex.IndexLevel;
  const dailyReturn = latestIndex.DailyReturn;
  const sinceInception = indexLevel / firstIndex.IndexLevel - 1;

  document.getElementById("indexLevel").textContent = indexLevel.toFixed(2);
  setReturn("dailyReturn", dailyReturn);
  setReturn("sinceInception", sinceInception);

  document.getElementById("totalValue").textContent =
    "$" + totalValue.toLocaleString(undefined, {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });

  document.getElementById("holdingCount").textContent = holdingsData.length;
  document.getElementById("marketDate").textContent = latestIndex.Date;
}

function setReturn(elementId, value) {
  const element = document.getElementById(elementId);
  const sign = value > 0 ? "+" : "";

  element.textContent = sign + (value * 100).toFixed(2) + "%";
  element.classList.remove("positive", "negative");

  if (value > 0) element.classList.add("positive");
  else if (value < 0) element.classList.add("negative");
}

function createIndexChart() {
  new Chart(document.getElementById("indexChart"), {
    type: "line",
    data: {
      labels: indexHistory.map(row => row.Date),
      datasets: [{
        label: "Index Level",
        data: indexHistory.map(row => row.IndexLevel),
        tension: 0.15,
        pointRadius: 3,
        borderWidth: 2
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: context => "Index: " + context.raw.toFixed(2)
          }
        }
      },
      scales: {
        y: {
          ticks: {
            callback: value => Number(value).toFixed(1)
          }
        }
      }
    }
  });
}

function createHoldingsChart() {
  const top10 = holdingsData.slice(0, 10);

  new Chart(document.getElementById("topHoldingsChart"), {
    type: "bar",
    data: {
      labels: top10.map(row => row.Symbol),
      datasets: [{
        label: "Weight (%)",
        data: top10.map(row => row.Weight * 100)
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: context => context.raw.toFixed(2) + "%"
          }
        }
      },
      scales: {
        y: {
          beginAtZero: true,
          ticks: {
            callback: value => value + "%"
          }
        }
      }
    }
  });
}

function createTable() {
  let html = `
    <table>
      <thead>
        <tr>
          <th>Symbol</th>
          <th>Name</th>
          <th class="number">Quantity</th>
          <th class="number">Price</th>
          <th class="number">Market Value</th>
          <th class="number">Weight</th>
        </tr>
      </thead>
      <tbody>
  `;

  holdingsData.forEach(row => {
    html += `
      <tr>
        <td><strong>${row.Symbol}</strong></td>
        <td>${row.Name}</td>
        <td class="number">${row.Quantity.toFixed(5)}</td>
        <td class="number">$${row.Price.toFixed(2)}</td>
        <td class="number">$${row.MarketValue.toFixed(2)}</td>
        <td class="number">${(row.Weight * 100).toFixed(2)}%</td>
      </tr>
    `;
  });

  html += `</tbody></table>`;
  document.getElementById("tableArea").innerHTML = html;
}
</script>

</body>
</html>
