<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Index Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f7fa;
      color: #222;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .card-title {
      color: #777;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .card-value {
      font-size: 28px;
      font-weight: bold;
    }

    .section {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 30px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      text-align: left;
      padding: 10px;
      border-bottom: 2px solid #ddd;
      cursor: pointer;
    }

    td {
      padding: 10px;
      border-bottom: 1px solid #eee;
    }

    th.number,
    td.number {
      text-align: right;
    }

    canvas {
      max-height: 420px;
    }

    .loading {
      padding: 30px;
      text-align: center;
      color: #666;
    }

    .error {
      color: #b00020;
      padding: 20px;
    }
  </style>
</head>


<body>

<div class="container">

  <h1>My Index Dashboard</h1>

  <div class="subtitle">
    Personal market-cap weighted index tracker
  </div>


  <div class="cards">

    <div class="card">
      <div class="card-title">Total Market Value</div>
      <div class="card-value" id="totalValue">Loading...</div>
    </div>

    <div class="card">
      <div class="card-title">Holdings</div>
      <div class="card-value" id="holdingCount">--</div>
    </div>

    <div class="card">
      <div class="card-title">Market Date</div>
      <div class="card-value" id="marketDate">--</div>
    </div>

    <div class="card">
      <div class="card-title">Largest Holding</div>
      <div class="card-value" id="largestHolding">--</div>
    </div>

  </div>


  <div class="section">

    <h2>Top 10 Holdings</h2>

    <canvas id="topHoldingsChart"></canvas>

  </div>


  <div class="section">

    <h2>Current Holdings</h2>

    <div id="tableArea" class="loading">
      Loading holdings...
    </div>

  </div>

</div>


<script>

let holdingsData = [];


// ==========================================================
// Load latest holdings
// ==========================================================

Papa.parse(
  "data/latest.csv",
  {
    download: true,
    header: true,
    dynamicTyping: true,

    complete: function(results) {

      holdingsData = results.data.filter(
        row => row.Symbol
      );

      holdingsData.sort(
        (a, b) => b.Weight - a.Weight
      );

      updateSummary();
      createChart();
      createTable();
    },

    error: function(error) {

      document.getElementById("tableArea").innerHTML =
        '<div class="error">Could not load latest.csv</div>';

      console.error(error);
    }
  }
);


// ==========================================================
// Summary cards
// ==========================================================

function updateSummary() {

  if (holdingsData.length === 0) {
    return;
  }

  const totalValue = holdingsData.reduce(
    (sum, row) => sum + row.MarketValue,
    0
  );

  const marketDate =
    holdingsData[0].PriceDate;

  const largest =
    holdingsData[0];

  document.getElementById("totalValue").textContent =
    "$" + totalValue.toLocaleString(
      undefined,
      {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }
    );

  document.getElementById("holdingCount").textContent =
    holdingsData.length;

  document.getElementById("marketDate").textContent =
    marketDate;

  document.getElementById("largestHolding").textContent =
    largest.Symbol + " " +
    (largest.Weight * 100).toFixed(2) + "%";
}


// ==========================================================
// Top 10 chart
// ==========================================================

function createChart() {

  const top10 =
    holdingsData.slice(0, 10);

  const labels =
    top10.map(row => row.Symbol);

  const weights =
    top10.map(
      row => row.Weight * 100
    );

  const ctx =
    document.getElementById(
      "topHoldingsChart"
    );

  new Chart(
    ctx,
    {
      type: "bar",

      data: {
        labels: labels,

        datasets: [
          {
            label: "Weight (%)",
            data: weights
          }
        ]
      },

      options: {

        responsive: true,

        plugins: {

          legend: {
            display: false
          },

          tooltip: {
            callbacks: {
              label: function(context) {
                return (
                  context.raw.toFixed(2)
                  + "%"
                );
              }
            }
          }
        },

        scales: {

          y: {
            beginAtZero: true,

            ticks: {
              callback: function(value) {
                return value + "%";
              }
            }
          }
        }
      }
    }
  );
}


// ==========================================================
// Holdings table
// ==========================================================

function createTable() {

  let html = `

    <table>

      <thead>

        <tr>

          <th>Symbol</th>

          <th>Name</th>

          <th class="number">
            Quantity
          </th>

          <th class="number">
            Price
          </th>

          <th class="number">
            Market Value
          </th>

          <th class="number">
            Weight
          </th>

        </tr>

      </thead>

      <tbody>

  `;


  holdingsData.forEach(
    row => {

      html += `

        <tr>

          <td>
            <strong>${row.Symbol}</strong>
          </td>

          <td>
            ${row.Name}
          </td>

          <td class="number">
            ${row.Quantity.toFixed(5)}
          </td>

          <td class="number">
            $${row.Price.toFixed(2)}
          </td>

          <td class="number">
            $${row.MarketValue.toFixed(2)}
          </td>

          <td class="number">
            ${(row.Weight * 100).toFixed(2)}%
          </td>

        </tr>

      `;
    }
  );


  html += `

      </tbody>

    </table>

  `;


  document.getElementById(
    "tableArea"
  ).innerHTML = html;
}

</script>


</body>
</html>
